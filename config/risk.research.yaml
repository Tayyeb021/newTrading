# Risk profile: RESEARCH. Not for any live account.
#
# The challenge and funded profiles exist to survive a prop firm's rulebook. This
# one exists to answer a different question: does an edge exist at all, before any
# rulebook is applied? For that the account-level limits must be wide enough that
# the risk engine sizes and gates trades exactly as it would live, but never halts
# a nine-year backtest on a bad month and never starves a 33-market book with a
# three-position cap. A strategy that survives here is then re-run under
# `challenge` to see what the rules cost it.
#
# Everything below is a limit, never a target. Position size still comes from
# `risk_per_trade` and the structural stop, exactly as everywhere else.

profile: research

account:
  size: 250000
  currency: USD

sizing:
  risk_per_trade: 0.005
  max_risk_per_trade: 0.01
  atr_period: 14
  atr_stop_multiple: 2.5

limits:
  daily_loss_soft: 0.10
  daily_loss_hard: 0.20
  max_drawdown_soft: 0.30
  max_drawdown_hard: 0.50
  drawdown_trailing: false

  # Wide enough that a three-sleeve book on 33 markets can hold EVERY signal at
  # once: 3 x 33 x 0.5% = 49.5% of equity at the stops. The first 007 run had
  # these at 40 / 0.15 / 0.04 and refused 173,000 signals on budget grounds, so
  # it measured a first-come-first-served subset, not the signal. Widened before
  # any result was read as a result; the numbers from that run are in the log.
  max_concurrent_positions: 200 # 4 sleeves x 46 markets = 184 legs
  max_open_risk: 0.92 # 184 legs x 0.5% at the stops; capacity must never be the binding constraint of a signal test
  max_bucket_risk: 0.15 # 7 markets x 3 sleeves x 0.5% = 10.5%; room for a fourth sleeve
  consecutive_losses: 100 # effectively off; a trend book loses six in a row routinely
  consecutive_loss_pause_hours: 1
  min_margin_level: 1.5
  max_spread_multiple: 3.0
  max_feed_age_seconds: 60.0

# One budget per sector. Both the full-size research root and its micro are
# listed so a book sized as micros lands in the same bucket.
buckets:
  us_indices: [ES, NQ, YM, RTY, EMD, MES, MNQ, MYM, M2K, US30, US500, NAS100]
  asia_indices: [NKD]
  rates: [ZT, ZF, ZN, ZB, UB, TN, SR3, ZQ]
  usd_majors: [6E, 6J, 6B, 6A, 6C, 6S, 6N, M6E, M6A, M6B, EURUSD, GBPUSD, AUDUSD, NZDUSD, USDJPY]
  em_fx: [6M, 6Z, 6L]
  metals: [GC, SI, HG, PL, PA, MGC, SIL, MHG, XAUUSD, XAGUSD]
  energy: [CL, NG, RB, HO, BZ, MCL]
  grains: [ZC, ZS, ZW, KE, ZM, ZL, ZO, ZR]
  meats: [LE, HE, GF]
  crypto: [BTC, MBT]
